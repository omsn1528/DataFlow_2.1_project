name: Build signed release (AAB + APK)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.11.1 }
      - name: Decode upload keystore
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/dataflow-upload.jks"
      - name: Build signed AAB and APK
        env:
          DATAFLOW_KEYSTORE_FILE: ${{ runner.temp }}/dataflow-upload.jks
          DATAFLOW_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          DATAFLOW_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          DATAFLOW_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease
      - name: Checksums
        run: |
          mkdir -p dist
          cp app/build/outputs/bundle/release/*.aab dist/
          cp app/build/outputs/apk/release/*.apk dist/
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Print signing certificate fingerprint (public information)
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: keytool -list -v -keystore "$RUNNER_TEMP/dataflow-upload.jks" -alias "$KS_ALIAS" -storepass "$KS_PASS" | grep -E "SHA1|SHA256|Owner|Valid"
      - uses: actions/upload-artifact@v4
        with:
          name: DataFlow-release
          path: dist/*
